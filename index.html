<head>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f0f2f5; }
        .container { text-align: center; padding: 40px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }

        .btn-materi:hover { background-color: #1e40af; transform: translateY(-2px); }
        .btn-kuis { background-color: #10b981; }
        .btn-kuis:hover { background-color: #059669; transform: translateY(-2px); }
    </style>
</head>

        <h1>Selamat Datang!</h1>

        <a href="materi.html" class="btn btn-materi">📖 Baca Materi</a>
