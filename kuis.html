<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru Pintar SMA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50">

    <header class="bg-blue-600 text-white p-6 shadow-lg">
        <h1 class="text-2xl font-bold">Portal Belajar MTK SMA</h1>
        <p class="text-sm opacity-80">Selamat datang, Pejuang PTN!</p>
    </header>

    <main class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500 hover:shadow-md transition">
            <i class="fas fa-book-open text-blue-500 text-3xl mb-4"></i>
            <h2 class="text-xl font-bold">Modul Materi</h2>
            <p class="text-gray-600 mb-4">Pelajari rumus cepat Eksponen, Logaritma, dan Trigonometri.</p>
            <a href="materi.html" class="inline-block bg-blue-600 text-white px-4 py-2 rounded-lg">Buka Materi</a>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500 hover:shadow-md transition">
            <i class="fas fa-edit text-green-500 text-3xl mb-4"></i>
            <h2 class="text-xl font-bold">Latihan Kuis</h2>
            <p class="text-gray-600 mb-4">Uji kemampuanmu dengan soal-soal standar UTBK.</p>
            <a href="kuis.html" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg">Mulai Kuis</a>
        </div>

    </main>

</body>
</html>
